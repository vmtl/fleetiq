name: Validate FleetIQ Release Features
on:
  push:
    paths:
      - app.py
      - recall_intelligence.py
      - ownership_intelligence.py
      - tests/test_release_intelligence.py
      - .github/workflows/validate_release.yml
  pull_request:
    paths:
      - app.py
      - recall_intelligence.py
      - ownership_intelligence.py
      - tests/test_release_intelligence.py
      - .github/workflows/validate_release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and test tools
        run: pip install -r requirements.txt pytest
      - name: Compile all application modules
        run: |
          python -m py_compile app.py recall_intelligence.py ownership_intelligence.py maintenance_forecast.py maintenance_intelligence.py repair_intelligence.py
      - name: Test recall API parsing, ownership math and existing intelligence
        run: |
          python -m pytest -q tests/test_release_intelligence.py tests/test_maintenance_forecast.py tests/test_maintenance_intelligence.py tests/test_repair_intelligence.py
      - name: Validate complete Streamlit application startup
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py", default_timeout=90).run()
          if app.exception:
              raise AssertionError(str(app.exception))
          labels = [t.label for t in app.tabs]
          print("FleetIQ tabs:", labels)
          assert len(labels) == 12, labels
          for title in ("Maintenance timing", "Repair costs", "Safety recalls", "Ownership economics", "Failure Hotspots"):
              assert title in labels, title
          PY
