
name: Refresh FleetIQ Data

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleetiq-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Download and process NHTSA data
        run: python refresh_data.py

      - name: Check generated files
        run: |
          ls -lh data/
          test -s data/complaints.csv
          test -s data/summary.csv
          test -s data/refresh_status.json

      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/complaints.csv
          git add data/summary.csv
          git add data/refresh_status.json

          if ! git diff --cached --quiet; then
            git commit -m "Automated FleetIQ NHTSA refresh"
            git push
          else
            echo "No dataset changes to commit."
          fi
